<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PopSon · IPL 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">

  <style>
    /* ─── Reset & Base ─────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:    #0C1829;
      --navy-2:  #152340;
      --navy-3:  #1e3060;
      --gold:    #E8A030;
      --gold-dim:#a06a18;
      --bg:      #F2F0EB;
      --surface: #FFFFFF;
      --border:  #E0DDD5;
      --border-2:#CCCAC0;
      --text:    #181820;
      --text-2:  #5C5B6A;
      --text-3:  #A09FA8;
      --today-bg:#FFFBEB;
    }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Masthead ─────────────────────────────────────── */
    .masthead {
      background: var(--navy);
      background-image:
        radial-gradient(ellipse 60% 80% at 20% 60%, rgba(232,160,48,0.10) 0%, transparent 70%),
        radial-gradient(ellipse 60% 80% at 80% 40%, rgba(40,80,200,0.14) 0%, transparent 70%),
        repeating-linear-gradient(
          -55deg,
          transparent 0px, transparent 18px,
          rgba(255,255,255,0.018) 18px, rgba(255,255,255,0.018) 19px
        );
      color: #fff;
      padding: 28px 20px 20px;
      text-align: center;
      position: relative;
    }

    /* ─── Sticky score bar (bottom half of header) ─── */
    .score-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--navy);
      background-image:
        radial-gradient(ellipse 80% 120% at 20% 50%, rgba(232,160,48,0.08) 0%, transparent 65%),
        radial-gradient(ellipse 80% 120% at 80% 50%, rgba(40,80,200,0.10) 0%, transparent 65%);
      border-top: 1px solid rgba(255,255,255,0.07);
      color: #fff;
      padding: 14px 20px 18px;
      text-align: center;
    }

    .season-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid rgba(232,160,48,0.35);
      border-radius: 20px;
      padding: 4px 12px;
      margin-bottom: 22px;
    }
    .season-pill::before,
    .season-pill::after {
      content: '●';
      font-size: 5px;
      opacity: 0.5;
    }

    /* Players */
    .players-row {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin-bottom: 18px;
    }

    .player {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      padding: 0 14px;
    }

    .player-face-score {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-score {
      font-size: 44px;
      font-weight: 800;
      color: #fff;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -1px;
    }

    .avatar-wrap {
      position: relative;
      width: 72px;
      height: 72px;
    }

    .avatar-wrap::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(
        var(--gold) 0deg,
        transparent 90deg,
        rgba(232,160,48,0.3) 180deg,
        transparent 270deg,
        var(--gold) 360deg
      );
      opacity: 0.5;
    }

    .avatar-wrap img {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: var(--navy-2);
      border: 2.5px solid rgba(255,255,255,0.12);
      display: block;
    }

    .player-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
    }

    .player-name {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      margin-top: -4px;
    }

    .vs-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 46px;
      gap: 3px;
    }
    .vs-line {
      width: 1px;
      height: 16px;
      background: rgba(255,255,255,0.1);
    }
    .vs-text {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,0.18);
    }

    /* Brand name */
    .brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(56px, 15vw, 88px);
      letter-spacing: 0.06em;
      line-height: 0.88;
      color: #fff;
      margin-bottom: 7px;
    }

    .brand-rule {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .brand-rule span {
      flex: 1;
      max-width: 60px;
      height: 1px;
      background: rgba(232,160,48,0.35);
    }
    .brand-tagline {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
    }

    /* ─── Centered content wrapper ────────────────────── */
    .content {
      max-width: 700px;
      margin: 0 auto;
    }

    /* ─── Legend bar ───────────────────────────────────── */
    .legend {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px 16px;
      padding: 9px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .legend-head {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-3);
    }

    .legend-sep { width: 1px; height: 14px; background: var(--border); }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--text-2);
    }

    .l-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 700;
    }

    /* ─── Table wrapper ────────────────────────────────── */
    /* overflow-x:clip does NOT create a scroll container, so sticky thead works */
    .table-outer {
      overflow-x: clip;
      background: var(--surface);
    }

    /* ─── Table ────────────────────────────────────────── */
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 380px;
    }

    /* Sticky header — top set by JS after load; fallback keeps it clear of score-bar */
    thead { position: sticky; top: 150px; z-index: 10; }

    thead tr { background: #2D3748; }

    th {
      padding: 8px 10px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      text-align: left;
      border-bottom: none;
      white-space: nowrap;
      user-select: none;
    }

    th.c-num { text-align: center; width: 36px; padding: 8px 4px; }
    th.c-pop,
    th.c-son { text-align: center; width: 1%; white-space: nowrap; }
    th.c-val { text-align: center; width: 52px; }
    th.c-res { text-align: center; width: 58px; }

    /* Avatar in th */
    .th-player {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .th-avatar {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--bg);
      vertical-align: middle;
      border: 1px solid rgba(255,255,255,0.25);
    }

    /* Body rows */
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 80ms;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #F5F3EE; }

    tbody tr.row-past { opacity: 0.52; }
    tbody tr.row-past:hover { opacity: 0.7; }

    tbody tr.row-today { background: var(--today-bg); }
    tbody tr.row-today:hover { background: #FFF6D5; }

    td {
      padding: 9px 10px;
      vertical-align: middle;
      font-size: 14px;
    }

    td.c-num {
      text-align: center;
      font-size: 12px;
      color: var(--text-2);
      width: 36px;
      padding: 9px 4px;
      font-variant-numeric: tabular-nums;
    }

    /* Today indicator replaces row number */
    tr.row-today td.c-num {
      color: #D97706;
      font-weight: 700;
    }

    td.c-date { white-space: nowrap; }

    .d-day  { font-size: 14px; font-weight: 700; color: var(--text); }
    .d-rest { font-size: 14px; color: var(--text); }
    .d-time { font-size: 14px; color: var(--text-2); font-variant-numeric: tabular-nums; }

    td.c-pop,
    td.c-son { text-align: center; padding-left: 6px; padding-right: 6px; }

    td.c-val { text-align: center; }

    td.c-res {
      text-align: center;
      color: var(--text-2);
      font-size: 15px;
    }

    /* Today pulse dot in result */
    .today-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #F59E0B;
      animation: pulse 2s ease-in-out infinite;
      vertical-align: middle;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1;   transform: scale(1);   }
      50%       { opacity: 0.4; transform: scale(1.35); }
    }

    /* ─── Team badges ──────────────────────────────────── */
    .tbadge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      padding: 3px 0;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      white-space: nowrap;
      line-height: 1.5;
    }

    /* ─── Value badges ─────────────────────────────────── */
    .vbadge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 30px;
      height: 28px;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 700;
      padding: 0 5px;
    }
    .v-lo { background: #D1FAE5; color: #065F46; }
    .v-md { background: #FEF3C7; color: #92400E; }
    .v-hi { background: #FEE2E2; color: #991B1B; }

    /* ─── Team colors ──────────────────────────────────── */
    .t-MI   { background: #004BA0; color: #fff; }
    .t-CSK  { background: #FFCB05; color: #1a1a1a; }
    .t-RCB  { background: #EC1C24; color: #fff; }
    .t-KKR  { background: #3A225D; color: #fff; }
    .t-SRH  { background: #FF822A; color: #fff; }
    .t-RR   { background: #EA1A85; color: #fff; }
    .t-DC   { background: #004C93; color: #fff; }
    .t-PBKS { background: #DD1F2D; color: #fff; }
    .t-GT   { background: #0B4973; color: #fff; }
    .t-LSG  { background: #A72056; color: #fff; }


    /* ─── Result avatar (in table Result column) ───────── */
    .result-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: block;
      margin: 0 auto;
    }

    /* ─── Last-result strip (injected row) ─────────────── */
    .lr-row td { padding: 0; }
    .lr-inner {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 9px 12px;
      background: #F7F6F2;
      border-top: 2px solid var(--border-2);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      color: var(--text);
    }
    .lr-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-3);
      flex-shrink: 0;
      margin-right: 2px;
    }
    .lr-beat {
      font-size: 12px;
      color: var(--text-2);
      flex-shrink: 0;
    }
    .lr-pts {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      flex-shrink: 0;
    }
    .lr-pts-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: block;
    }

    /* ─── Next-match hero (injected row) ───────────────── */
    .hero-row td { padding: 10px 0 14px; background: var(--bg); }
    .hero-card {
      background: var(--navy);
      background-image:
        radial-gradient(ellipse 70% 90% at 15% 50%, rgba(232,160,48,0.12) 0%, transparent 65%),
        radial-gradient(ellipse 70% 90% at 85% 50%, rgba(60,100,220,0.12) 0%, transparent 65%);
      border-radius: 10px;
      padding: 18px 16px 14px;
      text-align: center;
      margin: 0 12px;
    }
    .hero-eyebrow {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 14px;
    }
    .hero-matchup {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .hero-team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex: 1;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 38px;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.03em;
    }
    .hero-owner {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
    }
    .hero-mid {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0 4px;
    }
    .hero-imp {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 17px;
      font-weight: 800;
    }
    .hero-datetime {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
    }

    /* ─── Footer ───────────────────────────────────────── */
    .footer {
      text-align: center;
      padding: 18px 20px;
      font-size: 11px;
      color: var(--text-3);
      letter-spacing: 0.05em;
      border-top: 1px solid var(--border);
    }

    /* ─── Responsive ───────────────────────────────────── */
    @media (max-width: 480px) {
      .masthead { padding: 22px 14px 20px; }
      .avatar-wrap { width: 58px; height: 58px; }
      .player { padding: 0 10px; }
      .player-name { display: none; }
      .brand { font-size: 54px; }

      th, td { padding: 8px 7px; }
      th.c-num, td.c-num { padding: 8px 4px; width: 28px; }
      .tbadge { font-size: 10px; padding: 2px 6px; }
      .vbadge { min-width: 24px; height: 24px; font-size: 11px; }
      .d-day, .d-rest { font-size: 11px; }
      .d-time { font-size: 10px; }
    }
  </style>
</head>

      [24,'May','19:30','KKR','DC'],
    ];

    /* ── Scoring engine ───────────────────────────── */
    function computeMatch(a, b) {
      const pA = POP[a], pB = POP[b];
      const sA = SON[a], sB = SON[b];
      const popPick = pA < pB ? a : b;
      const sonPick = sA < sB ? a : b;
      const pDiff   = Math.abs(pA - pB);
      const sDiff   = Math.abs(sA - sB);
      let imp, popTeam, sonTeam;
      if (popPick !== sonPick) {
        imp = pDiff + sDiff + 1; popTeam = popPick; sonTeam = sonPick;
      } else {
        const fav = popPick, und = fav === a ? b : a;
        if (pDiff !== sDiff) {
          imp = Math.abs(pDiff - sDiff) + 1;
          popTeam = pDiff > sDiff ? fav : und;
          sonTeam = pDiff > sDiff ? und : fav;
        } else {
          imp = 1;
          const popHasFav = POP[fav] < SON[fav];
          popTeam = popHasFav ? fav : und;
          sonTeam = popHasFav ? und : fav;
        }
      }
      return { imp, popTeam, sonTeam };
    }

    /* ── Date helpers ─────────────────────────────── */
    const MON = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
    const DOW  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    function getDate(day, mon) { return new Date(2026, MON[mon], day); }
    function getDow(day, mon)  { return DOW[getDate(day, mon).getDay()]; }
    function to12h(t) {
      const [h, m] = t.split(':').map(Number);
      return `${h % 12 || 12}:${String(m).padStart(2, '0')}${h >= 12 ? 'pm' : 'am'}`;
    }

    /* ── Badge helpers ────────────────────────────── */
    function tbadge(t) { return `<span class="tbadge t-${t}">${t}</span>`; }
    function vbadge(v) {
      const cls = v <= 3 ? 'v-lo' : v <= 6 ? 'v-md' : 'v-hi';
      return `<span class="vbadge ${cls}">${v}</span>`;
    }

    /* ── Compute scores ───────────────────────────── */
    let popScore = 0, sonScore = 0;
    Object.entries(RESULTS).forEach(([idx, winner]) => {
      const [,,,a,b] = FIXTURES[+idx];
      const { imp, popTeam } = computeMatch(a, b);
      if (winner === popTeam) popScore += imp; else sonScore += imp;
    });
    document.getElementById('sb-pop').textContent = popScore;
    document.getElementById('sb-son').textContent = sonScore;

    /* ── Derived indices ──────────────────────────── */
    const lastIdx = Math.max(...Object.keys(RESULTS).map(Number));
    const nextIdx = FIXTURES.findIndex((_, i) => !(i in RESULTS));

    /* ── Hero row ─────────────────────────────────── */
    function createHeroRow() {
      const [day, mon, time, a, b] = FIXTURES[nextIdx];
      const { imp, popTeam, sonTeam } = computeMatch(a, b);
      const dow  = getDow(day, mon);
      const dd   = String(day).padStart(2, '0');
      const vCls = imp <= 3 ? 'v-lo' : imp <= 6 ? 'v-md' : 'v-hi';
      const tr   = document.createElement('tr');
      tr.id = 'hero-row';
      tr.className = 'hero-row';
      tr.innerHTML =
        `<td colspan="6" class="hero-cell"><div class="hero-card">` +
          `<div class="hero-eyebrow">Next Match</div>` +
          `<div class="hero-matchup">` +
            `<div class="hero-team">` +
              `<span class="hero-badge t-${popTeam}">${popTeam}</span>` +
              `<div class="hero-owner">Pop</div>` +
            `</div>` +
            `<div class="hero-mid">` +
              `<span class="hero-imp ${vCls}">${imp}</span>` +
            `</div>` +
            `<div class="hero-team">` +
              `<span class="hero-badge t-${sonTeam}">${sonTeam}</span>` +
              `<div class="hero-owner">Son</div>` +
            `</div>` +
          `</div>` +
          `<div class="hero-datetime">${dow} ${dd} ${mon} · ${to12h(time)} IST</div>` +
        `</div></td>`;
      return tr;
    }

    /* ── Render fixture rows ──────────────────────── */
    const now = new Date();
    now.setHours(0, 0, 0, 0);
    const tbody = document.getElementById('tbody');
    let lastResultRow = null; // captured during render, used for scroll

    FIXTURES.forEach(([day, mon, time, a, b], i) => {
      const { imp, popTeam, sonTeam } = computeMatch(a, b);
      const mDate = getDate(day, mon);
      mDate.setHours(0, 0, 0, 0);
      const isToday = mDate.getTime() === now.getTime();
      const winner  = RESULTS[i];

      let res;
      if (winner !== undefined) {
        const winnerIsPop = winner === popTeam;
        res = `<img src="assets/${winnerIsPop ? 'pop' : 'son'}-sm.png"` +
              ` class="result-avatar" title="${winnerIsPop ? 'Pop' : 'Son'} +${imp}">`;
      } else if (isToday) {
        res = `<span class="today-dot" title="Today"></span>`;
      } else {
        res = '—';
      }

      const dow = getDow(day, mon);
      const dd  = String(day).padStart(2, '0');
      const tr  = document.createElement('tr');
      if (isToday) tr.classList.add('row-today');

      tr.innerHTML =
        `<td class="c-num">${i + 1}</td>` +
        `<td class="c-date">` +
          `<span class="d-day">${dow}</span>` +
          `<span class="d-rest"> ${dd} ${mon}</span>` +
          ` <span class="d-time">${to12h(time)}</span>` +
        `</td>` +
        `<td class="c-pop">${tbadge(popTeam)}</td>` +
        `<td class="c-son">${tbadge(sonTeam)}</td>` +
        `<td class="c-val">${vbadge(imp)}</td>` +
        `<td class="c-res">${res}</td>`;

      tbody.appendChild(tr);
      if (RESULTS[i] !== undefined) lastResultRow = tr;

      // Inject hero row after last completed match
      if (i === lastIdx) {
        tbody.appendChild(createHeroRow());
      }
    });

    /* ── Set thead offset + scroll to last completed match (after full load) ── */
    // offsetDocTop walks offsetParent chain — correct regardless of current scrollY
    function offsetDocTop(el) {
      let t = 0;
      while (el) { t += el.offsetTop; el = el.offsetParent; }
      return t;
    }

    window.addEventListener('load', function () {
      const scoreBar = document.querySelector('.score-bar');
      const theadEl  = document.querySelector('thead');
      const sbH = scoreBar ? scoreBar.offsetHeight : 0;
      const thH = theadEl  ? theadEl.offsetHeight  : 0;

      if (theadEl) theadEl.style.top = sbH + 'px';

      if (lastResultRow) {
        const targetY = offsetDocTop(lastResultRow) - sbH - thH;
        window.scrollTo({ top: Math.max(0, targetY), behavior: 'instant' });
      }
    });
  </script>
</body>
</html>
